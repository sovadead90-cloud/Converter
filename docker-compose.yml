services:
  postgres:
    image: postgres:15-alpine
    container_name: converter_postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: converter_db
      POSTGRES_USER: converter_user
      POSTGRES_PASSWORD: postgres111

  minio:
    image: cr.yandex/mirror/minio/minio:latest
    container_name: converter_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: my_secure_minio_admin
      MINIO_ROOT_PASSWORD: minio111
    command: server /data --console-address ":9001"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: converter_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: converter_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1