spring:
  application:
    name: file-conversion-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/converter_db}
    username: ${DB_USERNAME:converter_user}
    password: ${DB_PASSWORD:postgres111}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:file-converter-group}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      enable-idempotence: true
      retries: 2147483647

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  accessKey: ${MINIO_ACCESS_KEY:my_secure_minio_admin}
  secretKey: ${MINIO_SECRET_KEY:minio111}
  bucketName: ${MINIO_BUCKET:saga-file-storage}
